name: Radix
options:
  minimumXcodeGenVersion: 2.38.0
settings:
  base:
    SWIFT_VERSION: 6.0
    PRODUCT_NAME: Radix
packages: {}
targets:
  Radix:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    settings:
      base:
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/Radix.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.desmond.radix
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: 1.0.6
        CURRENT_PROJECT_VERSION: 2
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: YES
        TARGETED_DEVICE_FAMILY: 1,2
    dependencies:
      - target: RadixShareExtension
        embed: true
        destinationFilters:
          - iOS
    sources:
      - path: App
      - path: Models
      - path: Services
      - path: Shared
      - path: ViewModels
      - path: Views
      - path: Resources
        buildPhase: resources
      - path: Resources/hanzi-writer.min.js
        buildPhase: resources
      - path: Resources/character_strokes.db
        buildPhase: resources
      - path: Resources/japanese_character_strokes.db
        buildPhase: resources
      - path: ./enhanced_component_map_with_etymology.json
        buildPhase: resources
      - path: ./phrases.db
        buildPhase: resources
      - path: ./SUBTLEX-CH-CHR.txt
        buildPhase: resources
  RadixShareExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    settings:
      base:
        PRODUCT_NAME: RadixShareExtension
        PRODUCT_MODULE_NAME: RadixShareExtension
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: ShareExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: ShareExtension/RadixShareExtension.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.desmond.radix.shareextension
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: 1.0.6
        CURRENT_PROJECT_VERSION: 2
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
    sources:
      - path: ShareExtension
      - path: Shared
