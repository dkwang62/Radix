name: PageDeletionProbe
options:
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_OPTIMIZATION_LEVEL: "-O"
    GENERATE_INFOPLIST_FILE: YES
targets:
  PageDeletionProbe:
    type: application
    platform: iOS
    sources: &probeSources
      - path: ../../Models
        excludes:
          - BackupSummaryBuilder.swift
          - BrowseGridLayout.swift
          - ImagePhraseMatcher.swift
          - RadixStoreExtractedHelpers.swift
          - ResponsiveFont.swift
      - path: ../../Services/RadixPreferences.swift
      - path: ../../Tests/PageDeletionProbe/Probe.swift
    dependencies:
      - sdk: libsqlite3.tbd
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.desmond.radix.deletionqa
        INFOPLIST_KEY_CFBundleDisplayName: Radix Deletion QA
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        DEVELOPMENT_TEAM: 7PSNWRPJ5B
        CODE_SIGN_STYLE: Automatic
  PageDeletionProbeCLI:
    type: tool
    platform: macOS
    sources: *probeSources
    dependencies:
      - sdk: libsqlite3.tbd
