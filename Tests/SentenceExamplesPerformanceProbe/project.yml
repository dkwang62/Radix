name: SentenceExamplesPerformanceProbe
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_OPTIMIZATION_LEVEL: "-O"
    GENERATE_INFOPLIST_FILE: YES
targets:
  SentenceExamplesPerformanceProbe:
    type: application
    platform: iOS
    sources:
      - path: ../../Models
        excludes:
          - BackupSummaryBuilder.swift
          - BrowseGridLayout.swift
          - ImagePhraseMatcher.swift
          - RadixStoreExtractedHelpers.swift
          - ResponsiveFont.swift
      - path: ../../Tests/SentenceExamplesPerformanceProbe/Probe.swift
    dependencies:
      - sdk: libsqlite3.tbd
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.desmond.radix.sentenceexamplesqa
        INFOPLIST_KEY_CFBundleDisplayName: Radix Examples QA
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        DEVELOPMENT_TEAM: 7PSNWRPJ5B
        CODE_SIGN_STYLE: Automatic
